<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloatingTODO</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        primary: "#406651",
        "error-container": "#ffdad6",
        surface: "#f8f9ff",
        "on-surface": "#0b1c30",
        "surface-container": "#e5eeff",
        "surface-container-low": "#eff4ff",
        "primary-fixed": "#c1edd1",
        outline: "#717973"
      },
      spacing: { standard: "12px" },
      fontFamily: {
        "task-text": ["Inter"],
        "task-subtext": ["Inter"]
      },
      fontSize: {
        "task-text": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }],
        "task-subtext": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "400" }]
      }
    }
  }
};
</script>
<style>
* { box-sizing: border-box; }
body {
  background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuChNjkBzeTu8rX5dVY96VGHMEl6LPpKTtsmSFP59sJDRnFlVZFuOnBcc-5lnJp7t2U1Lz7AvWEVsQNDR3yqdsic1WN4jE7sHDdp7_ZmAQGbqiBDlZbVf1Dzh8oWQfUoF3EuOFCmNBHD3CUbMT9WC1V4okiiWjIlbETibxM2tE5FOfO7lXpoxej9Zs2LDEchUpM727g_F7Kssmw0uA6wJzQx4jIxbyZziL8Z8Yal8Dco_Qa6EolZNgsG55SUVZhChzSsI_lgQehmixw);
  background-size: cover;
  background-position: center;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  overflow: hidden;
}
.todo-widget {
  inline-size: 380px;
  max-block-size: min(615px, calc(100vh - 40px));
  height: auto;
  transform-origin: top center;
  transition: none;
}
.todo-widget.is-height-ready {
  transition: height 190ms cubic-bezier(.2, .8, .2, 1);
}
body.is-dragging-task,
.todo-widget {
  user-select: none;
  -webkit-user-select: none;
}
.task-list {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  min-block-size: 0;
  overflow-x: hidden;
  overflow-y: hidden;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.todo-widget.is-scrollable .task-list {
  block-size: 100%;
  overflow-y: auto;
}
.task-list::-webkit-scrollbar {
  inline-size: 0;
  block-size: 0;
  display: none;
}
.task-item {
  background: rgba(255,255,255,.42);
  border: 1px solid rgba(255,255,255,.24);
  cursor: grab;
  position: relative;
  transition:
    background-color 180ms ease,
    border-color 180ms ease,
    opacity 220ms ease,
    transform 260ms cubic-bezier(.2,.8,.2,1),
    min-height 260ms cubic-bezier(.2,.8,.2,1);
}
.task-item:hover { background: rgba(255,255,255,.52); }
.task-item:hover .done-actions,
.subtask-row:hover .subtask-actions {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(0) scale(1);
}
.task-item.is-done {
  background: rgba(193,237,209,.2);
  border-color: rgba(64,102,81,.2);
}
.task-item.is-done:hover { background: rgba(193,237,209,.28); }
.task-title {
  position: relative;
  display: inline-block;
  transition: opacity 180ms ease;
}
.task-item.is-done .task-title { opacity: .68; }
.task-item.is-done .task-title,
.subtask-title.line-through { text-decoration: line-through; }
.task-head {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.task-head > div:first-child {
  min-width: 0;
  flex: 1;
}
.task-item.is-editing .task-head > div:first-child { inline-size: 100%; }
.task-item.is-editing .done-actions,
.task-item.is-editing .collapse-toggle,
.subtask-row.is-editing .subtask-actions { display: none; }
.add-task-card {
  cursor: default;
  flex-shrink: 0;
}
.add-task-card:hover { background: rgba(255,255,255,.48); }
.add-task-card .task-head { min-height: 24px; }
.add-square {
  inline-size: 24px;
  block-size: 24px;
  background: transparent;
  border: 0;
  box-shadow: none;
  -webkit-tap-highlight-color: transparent;
}
.add-square:hover,
.add-square:active,
.add-square:focus,
.add-square:focus-visible {
  background: transparent;
  box-shadow: none;
  outline: none;
}
.add-square .material-symbols-outlined {
  transition: transform 260ms cubic-bezier(.2,.8,.2,1);
}
.add-task-card.is-open .add-square .material-symbols-outlined {
  transform: rotate(45deg);
}
.top-add-input {
  box-sizing: border-box;
  min-width: 0;
  max-width: 0;
  min-height: 24px;
  opacity: 0;
  overflow: hidden;
  pointer-events: none;
  transform: scaleX(.82);
  transform-origin: left center;
  transition:
    max-width 320ms cubic-bezier(.2,.8,.2,1),
    opacity 180ms ease,
    transform 320ms cubic-bezier(.2,.8,.2,1);
}
.add-task-card.is-open .top-add-input {
  max-width: 286px;
  opacity: 1;
  pointer-events: auto;
  transform: scaleX(1);
}
.progress-track {
  display: none;
  block-size: 4px;
  background: rgba(255,255,255,.2);
  border-radius: 999px;
  margin: 8px 40px 0;
  overflow: hidden;
}
.task-item.has-subtasks .progress-track { display: block; }
.progress-fill {
  block-size: 100%;
  background: #406651;
  border-radius: 999px;
  inline-size: 0%;
  transition: width 300ms ease-out;
}
.collapse-toggle { display: none; }
.task-item.has-subtasks .collapse-toggle { display: flex; }
.collapse-toggle .material-symbols-outlined {
  transition: transform 280ms cubic-bezier(.2,.8,.2,1);
}
.task-item.is-collapsed .collapse-toggle .material-symbols-outlined {
  transform: rotate(180deg);
}
.subtask-panel {
  display: grid;
  grid-template-rows: 0fr;
  opacity: 0;
  margin-top: 0;
  transition:
    grid-template-rows 300ms cubic-bezier(.2,.8,.2,1),
    opacity 220ms ease,
    margin-top 300ms cubic-bezier(.2,.8,.2,1);
}
.task-item.has-subtasks .subtask-panel {
  grid-template-rows: 1fr;
  opacity: 1;
  margin-top: 12px;
}
.task-item.is-collapsed .subtask-panel {
  grid-template-rows: 0fr;
  opacity: 0;
  margin-top: 0;
}
.subtask-inner {
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.subtask-row {
  cursor: grab;
  touch-action: none;
  border-radius: 8px;
  margin-inline-start: 34px;
  padding-inline-start: 8px;
  padding-inline-end: 4px;
  min-height: 30px;
  user-select: none;
  -webkit-user-select: none;
  transition:
    background-color 160ms ease,
    opacity 180ms ease,
    transform 220ms cubic-bezier(.2,.8,.2,1);
}
.subtask-row > .subtask-title {
  min-width: 0;
  flex: 1;
}
.subtask-row:hover { background: rgba(255,255,255,.18); }
.subtask-row .complete-toggle {
  inline-size: 18px;
  block-size: 18px;
}
.subtask-row .material-symbols-outlined { font-size: 18px; }
.complete-toggle .material-symbols-outlined {
  transition: transform 220ms cubic-bezier(.2,.8,.2,1), color 160ms ease;
}
.complete-toggle:active .material-symbols-outlined { transform: scale(.82); }
.complete-toggle.is-checked .material-symbols-outlined {
  color: #406651;
  filter: none;
  transform: scale(1.08);
}
.done-actions,
.subtask-actions {
  opacity: 0;
  pointer-events: none;
  transform: translateX(8px) scale(.92);
  transition: opacity 180ms ease, transform 220ms cubic-bezier(.2,.8,.2,1);
}
.edit-task,
.delete-task {
  inline-size: 30px;
  block-size: 30px;
  background: transparent;
  color: #717973;
  transition: color 160ms ease, transform 160ms ease;
}
.edit-task:hover {
  background: transparent;
  color: #406651;
  transform: translateY(-1px) scale(1.04);
}
.delete-task:hover {
  background: transparent;
  color: #b3261e;
  transform: translateY(-1px) scale(1.04);
}
.edit-name-shell {
  box-sizing: border-box;
  min-width: 0;
  min-height: 24px;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  background: rgba(255,255,255,.02);
  border: 1px solid rgba(255,255,255,.04);
  border-radius: 8px;
  opacity: 1;
  pointer-events: auto;
  transform: scaleX(1);
  transform-origin: left center;
  transition: background-color 160ms ease, border-color 160ms ease;
}
.edit-name-shell:focus-within {
  border-color: rgba(255,255,255,.10);
  background: rgba(255,255,255,.05);
}
.edit-name-input {
  appearance: none;
  -webkit-appearance: none;
  min-inline-size: 0;
  inline-size: 100%;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-sizing: border-box;
  color: #0b1c30;
  font: inherit;
  line-height: 20px;
  outline: none;
  padding: 0;
  min-block-size: 24px;
  caret-color: #406651;
  box-shadow: none;
}
.edit-name-input:focus { box-shadow: none; }
.task-head .edit-name-shell,
.subtask-row .edit-name-shell { flex: 1; }
.task-item.is-swipe-preview,
.subtask-row.is-swipe-preview { transition: transform 120ms ease; }
.task-item.is-dragging,
.subtask-row.is-dragging,
.drag-ghost {
  cursor: grabbing;
  opacity: .96;
  pointer-events: none;
  z-index: 50;
  box-shadow: 0 14px 30px rgba(11,28,48,.14);
  transition: none;
}
.drag-ghost {
  position: absolute;
  margin: 0;
  will-change: transform;
}
.drop-main-placeholder,
.drop-subtask-placeholder {
  border: 1px dashed rgba(64,102,81,.26);
  background: rgba(255,255,255,.16);
}
.drop-main-placeholder {
  border-radius: 8px;
  min-height: 48px;
}
.drop-subtask-placeholder {
  border-radius: 8px;
  height: 32px;
  margin-inline-start: 34px;
}
.task-item.is-new { animation: newTaskSlideIn 420ms cubic-bezier(.2,.8,.2,1) both; }
.task-item.is-removing,
.subtask-row.is-removing { pointer-events: none; }
.task-item.is-completing { animation: taskCompletePop 520ms cubic-bezier(.2,.8,.2,1); }
.task-item.is-drop-settling { animation: dragSettle 220ms cubic-bezier(.2,.8,.2,1); }
.task-item.is-subtask-target {
  background: rgba(193,237,209,.18);
  border-color: rgba(64,102,81,.28);
}
.task-item.is-subtask-target .subtask-panel {
  grid-template-rows: 1fr;
  opacity: 1;
  margin-top: 12px;
}
.task-item.is-growing .progress-track,
.task-item.is-growing .collapse-toggle {
  animation: subtaskChromeIn 260ms cubic-bezier(.2,.8,.2,1) both;
}
@keyframes newTaskSlideIn {
  from { opacity: 0; transform: translateX(-34px) scaleX(.88); transform-origin: left center; }
  70% { opacity: 1; transform: translateX(2px) scaleX(1.01); }
  to { opacity: 1; transform: translateX(0) scaleX(1); }
}
@keyframes taskCompletePop {
  0% { transform: scale(1); }
  38% { transform: scale(.985); }
  70% { transform: scale(1.018); }
  100% { transform: scale(1); }
}
@keyframes dragSettle {
  0% { transform: scale(1.01); }
  100% { transform: scale(1); }
}
@keyframes subtaskChromeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="todo-widget bg-surface/30 backdrop-blur-[40px] rounded-2xl border border-white/40 shadow-xl overflow-hidden flex flex-col">
<main class="task-list" id="taskList">
<div class="task-item has-subtasks flex flex-col rounded-lg p-standard">
<div class="task-head flex items-center justify-between">
<div class="flex items-center gap-standard">
<button aria-label="Complete task" class="complete-toggle text-outline hover:text-primary transition-colors flex items-center justify-center" type="button">

</button>

</div>
</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<span class="subtask-title font-task-subtext text-task-subtext text-outline line-through">Color Palette</span>
<div class="subtask-actions flex gap-1">
<button aria-label="Edit subtask" class="edit-task edit-subtask rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[16px]">edit</span></button>
<button aria-label="Delete subtask" class="delete-task delete-subtask rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[16px]">delete</span></button>

</div>
<div class="subtask-row flex items-center gap-standard">
<button aria-label="Complete subtask" class="complete-toggle text-outline hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">circle</span>
</button>
<span class="subtask-title font-task-subtext text-task-subtext text-on-surface">Typography</span>
<div class="subtask-actions flex gap-1">
<button aria-label="Edit subtask" class="edit-task edit-subtask rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[16px]">edit</span></button>
<button aria-label="Delete subtask" class="delete-task delete-subtask rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[16px]">delete</span></button>
</div>
</div>
</div></div>
</div>
<div class="task-item is-done flex flex-col rounded-lg p-standard">
<div class="task-head flex items-center justify-between">
<div class="flex items-center gap-standard">
<button aria-label="Complete task" class="complete-toggle is-checked text-primary flex items-center justify-center rounded-full" type="button">
<span class="complete-icon material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<span class="task-title font-task-text text-task-text text-on-surface">Weekly Sync Prep</span>
</div>
<div class="flex items-center gap-2">
<div class="done-actions flex gap-1">
<button aria-label="Edit task" class="edit-task rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[18px]">edit</span></button>
<button aria-label="Delete task" class="delete-task rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[18px]">delete</span></button>
</div>

</div>
</div>
<div class="progress-track"><div class="progress-fill"></div></div>
<div class="subtask-panel"><div class="subtask-inner"></div></div>
</div>

<div class="task-head flex items-center justify-between">
<div class="flex items-center gap-standard">
<button aria-label="Complete task" class="complete-toggle text-outline hover:text-primary transition-colors flex items-center justify-center" type="button">
<span class="complete-icon material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">circle</span>
</button>
<span class="task-title font-task-text text-task-text text-on-surface">Buy Groceries</span>
</div>

<div class="done-actions flex gap-1">
<button aria-label="Edit task" class="edit-task rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[18px]">edit</span></button>
<button aria-label="Delete task" class="delete-task rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[18px]">delete</span></button>
</div>
<button aria-expanded="true" aria-label="Collapse subtasks" class="collapse-toggle text-outline hover:text-on-surface p-1 items-center justify-center" type="button"><span class="material-symbols-outlined text-[20px]">expand_more</span></button>
</div>
</div>

<div class="subtask-panel"><div class="subtask-inner"></div></div>
</div>

<div class="task-head flex items-center justify-start gap-standard">
<button aria-expanded="false" aria-label="Add task" class="add-square hover:text-on-surface text-primary shrink-0 flex items-center justify-center focus:outline-none rounded-full" id="addTaskToggle" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">add</span>
</button>
<form class="top-add-input flex flex-1 items-center gap-2 px-2 py-0 bg-white/[0.02] rounded-lg border border-white/[0.04] focus-within:bg-white/[0.05] focus-within:border-white/10" id="topAddComposer">
<input aria-label="New task" autocomplete="off" class="bg-transparent border-none w-full font-task-text text-task-text text-on-surface focus:ring-0 p-0 caret-primary" id="newTaskInput" type="text">
</form>

<script>
const addTaskToggle = document.getElementById("addTaskToggle");
const taskAddCard = document.getElementById("taskAddCard");
const topAddComposer = document.getElementById("topAddComposer");
const newTaskInput = document.getElementById("newTaskInput");
const taskList = document.getElementById("taskList");
const todoWidget = document.querySelector(".todo-widget");
const LONG_PRESS_MS = 280;
const DRAG_CANCEL_DISTANCE = 8;
const SWIPE_ACTION_DISTANCE = 86;
const SWIPE_PREVIEW_DISTANCE = 10;
let pendingDrag = null;
let dragState = null;
let swipeState = null;
let suppressNextClick = false;
let heightTransitionsEnabled = false;

addTaskToggle.addEventListener("click", () => {
  const willOpen = !taskAddCard.classList.contains("is-open");
  const previousHeight = snapshotWidgetHeight();
  taskAddCard.classList.toggle("is-open", willOpen);
  addTaskToggle.setAttribute("aria-expanded", String(willOpen));
  animateWidgetHeight(previousHeight);
  if (willOpen) requestAnimationFrame(() => newTaskInput.focus());
  else closeAddComposer(true);
});

document.addEventListener("pointerdown", (event) => {
  if (!taskAddCard.classList.contains("is-open")) return;
  if (taskAddCard.contains(event.target)) return;
  closeAddComposer(false);
});

topAddComposer.addEventListener("submit", (event) => {
  event.preventDefault();
  commitNewTask();
});

newTaskInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.isComposing) {
    event.preventDefault();
    commitNewTask();
    return;
  }
  if (event.key === "Escape") {
    closeAddComposer(true);
    addTaskToggle.focus();
  }
});

taskList.addEventListener("click", (event) => {
  if (suppressNextClick) {
    suppressNextClick = false;
    if (!event.target.closest(".edit-task, .delete-task, .complete-toggle, .collapse-toggle")) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }
  }

  const editSubtaskButton = event.target.closest(".edit-subtask");
  if (editSubtaskButton) {
    startEdit(editSubtaskButton.closest(".subtask-row"));
    return;
  }

  const deleteSubtaskButton = event.target.closest(".delete-subtask");
  if (deleteSubtaskButton) {
    removeSubtask(deleteSubtaskButton.closest(".subtask-row"));
    return;
  }

  const editButton = event.target.closest(".edit-task");
  if (editButton) {
    startEdit(editButton.closest(".task-item"));
    return;
  }

  const deleteButton = event.target.closest(".delete-task");
  if (deleteButton) {
    removeTask(deleteButton.closest(".task-item"));
    return;
  }

  const collapseButton = event.target.closest(".collapse-toggle");
  if (collapseButton) {
    const task = collapseButton.closest(".task-item");
    const willCollapse = !task.classList.contains("is-collapsed");
    const previousHeight = snapshotWidgetHeight();
    task.classList.toggle("is-collapsed", willCollapse);
    collapseButton.setAttribute("aria-expanded", String(!willCollapse));
    animateWidgetHeight(previousHeight);
    return;
  }

  const completeButton = event.target.closest(".complete-toggle");
  if (!completeButton) return;

  const subtaskRow = completeButton.closest(".subtask-row");
  if (subtaskRow) {
    setSubtaskComplete(completeButton, !completeButton.classList.contains("is-checked"));
    updateTaskFromSubtasks(subtaskRow.closest(".task-item"));
    return;
  }

  const task = completeButton.closest(".task-item");
  const willComplete = !completeButton.classList.contains("is-checked");
  setTaskDone(task, willComplete);
  getSubtaskRows(task).forEach((row) => setSubtaskComplete(row.querySelector(".complete-toggle"), willComplete));
  updateTaskFromSubtasks(task, { skipDone: true });
});

taskList.addEventListener("pointerdown", (event) => {
  if (event.button !== 0 || isInteractiveTarget(event.target)) return;
  const row = event.target.closest(".subtask-row");
  const task = row ? row.closest(".task-item") : event.target.closest(".task-item");
  const element = row || task;
  if (!element || element.classList.contains("add-task-card") || element.classList.contains("is-removing")) return;

  swipeState = {
    pointerId: event.pointerId,
    element,
    type: row ? "subtask" : "task",
    startX: event.clientX,
    startY: event.clientY,
    active: false
  };

  pendingDrag = {
    type: row ? "subtask" : "task",
    element,
    sourceTask: task,
    pointerId: event.pointerId,
    startX: event.clientX,
    startY: event.clientY,
    currentX: event.clientX,
    currentY: event.clientY,
    timer: window.setTimeout(startDrag, LONG_PRESS_MS)
  };

  taskList.setPointerCapture(event.pointerId);
});

taskList.addEventListener("pointermove", (event) => {
  if (swipeState && swipeState.pointerId === event.pointerId && !dragState) {
    const deltaX = event.clientX - swipeState.startX;
    const deltaY = event.clientY - swipeState.startY;

    if (Math.abs(deltaX) > SWIPE_PREVIEW_DISTANCE && Math.abs(deltaX) > Math.abs(deltaY) * 1.35) {
      swipeState.active = true;
      clearPendingDrag(false);
      event.preventDefault();
      const limited = getSwipePreviewOffset(deltaX);
      swipeState.element.classList.add("is-swipe-preview");
      swipeState.element.style.transform = `translateX(${limited}px)`;
    }
  }

  if (pendingDrag && pendingDrag.pointerId === event.pointerId) {
    pendingDrag.currentX = event.clientX;
    pendingDrag.currentY = event.clientY;
    const moved = Math.hypot(event.clientX - pendingDrag.startX, event.clientY - pendingDrag.startY);
    if (!dragState && moved > DRAG_CANCEL_DISTANCE) clearPendingDrag();
  }

  if (!dragState || dragState.pointerId !== event.pointerId) return;
  event.preventDefault();
  moveDraggedItem(event.clientX, event.clientY);
});

taskList.addEventListener("pointerup", (event) => {
  if (handleSwipeRelease(event)) return;
  finishDrag(event);
});

taskList.addEventListener("pointercancel", (event) => {
  resetSwipe(event);
  finishDrag(event);
});

function closeAddComposer(clearValue) {
  const previousHeight = snapshotWidgetHeight();
  if (clearValue) newTaskInput.value = "";
  taskAddCard.classList.remove("is-open");
  addTaskToggle.setAttribute("aria-expanded", "false");
  animateWidgetHeight(previousHeight);
}

function getTaskItems() {
  return Array.from(taskList.querySelectorAll(":scope > .task-item:not(.add-task-card)"));
}

function getAnimatedItems() {
  return [
    ...getTaskItems(),
    taskAddCard,
    ...Array.from(taskList.querySelectorAll(".subtask-row"))
  ].filter(Boolean);
}

function getSubtaskRows(task) {
  return Array.from(task.querySelectorAll(".subtask-row"));
}

function animateListShift(previousRects, options = {}) {
  if (options.onlyMovedDown) {
    getAnimatedItems().forEach((item) => {
      const previous = previousRects.get(item);
      if (!previous) return;
      const current = item.getBoundingClientRect();
      const deltaY = previous.top - current.top;
      if (deltaY <= 0) return;
      item.animate(
        [{ transform: `translateY(${deltaY}px)` }, { transform: "translateY(0)" }],
        { duration: 190, easing: "cubic-bezier(.2, .8, .2, 1)" }
      );
    });
    return;
  }

  getAnimatedItems().forEach((item) => {
    const previous = previousRects.get(item);
    if (!previous) return;
    const current = item.getBoundingClientRect();
    const deltaY = previous.top - current.top;
    if (!deltaY) return;
    item.animate(
      [{ transform: `translateY(${deltaY}px)` }, { transform: "translateY(0)" }],
      { duration: 190, easing: "cubic-bezier(.2, .8, .2, 1)" }
    );
  });
}

function getWidgetMaxHeight() {
  return Math.min(615, window.innerHeight - 40);
}

function measureWidgetContentHeight() {
  const children = Array.from(taskList.children).filter((child) => {
    return child.offsetParent !== null &&
      !child.classList.contains("drag-ghost") &&
      !child.classList.contains("is-removing");
  });

  if (!children.length) return 0;

  const styles = getComputedStyle(taskList);
  const bottomPadding = parseFloat(styles.paddingBottom) || 0;
  const layoutBottom = children.reduce((bottom, child) => {
    return Math.max(bottom, child.offsetTop + child.offsetHeight);
  }, 0);

  return Math.ceil(layoutBottom + bottomPadding);
}

function applyWidgetHeight() {
  const maxHeight = getWidgetMaxHeight();
  const contentHeight = measureWidgetContentHeight();
  const shouldScroll = contentHeight > maxHeight + 1;

  todoWidget.classList.toggle("is-scrollable", shouldScroll);
  todoWidget.style.height = `${Math.min(contentHeight, maxHeight)}px`;
}

function initializeWidgetHeight() {
  heightTransitionsEnabled = false;
  todoWidget.classList.remove("is-height-ready");
  applyWidgetHeight();
}

function enableWidgetHeightTransitions() {
  applyWidgetHeight();
  requestAnimationFrame(() => {
    heightTransitionsEnabled = true;
    todoWidget.classList.add("is-height-ready");
  });
}

function settleWidgetHeight() {
  requestAnimationFrame(() => {
    if (heightTransitionsEnabled) animateWidgetHeight();
    else applyWidgetHeight();
  });
}

function snapshotWidgetHeight() {
  return todoWidget.getBoundingClientRect().height || Math.min(measureWidgetContentHeight(), getWidgetMaxHeight());
}

function animateWidgetHeight(previousHeight = snapshotWidgetHeight()) {
  if (!heightTransitionsEnabled) {
    applyWidgetHeight();
    return;
  }

  const maxHeight = getWidgetMaxHeight();
  const contentHeight = measureWidgetContentHeight();
  const shouldScroll = contentHeight > maxHeight + 1;
  const nextHeight = shouldScroll ? maxHeight : contentHeight;

  todoWidget.style.height = `${previousHeight}px`;
  void todoWidget.offsetHeight;
  todoWidget.classList.toggle("is-scrollable", shouldScroll);

  requestAnimationFrame(() => {
    todoWidget.style.height = `${nextHeight}px`;
  });
}

function animateWidgetHeightAfterListShift(previousHeight) {
  requestAnimationFrame(() => animateWidgetHeight(previousHeight));
}

function snapshotMovables() {
  return new Map(
    getAnimatedItems()
      .filter((item) => !item.classList.contains("is-dragging"))
      .map((item) => [item, item.getBoundingClientRect()])
  );
}

function commitNewTask() {
  const taskName = newTaskInput.value.trim();
  if (!taskName) return;

  const wasScrollable = todoWidget.classList.contains("is-scrollable");
  const previousRects = snapshotMovables();
  const previousHeight = snapshotWidgetHeight();
  const task = createTaskElement(taskName);
  task.classList.add("is-new");
  taskList.insertBefore(task, taskAddCard);
  animateWidgetHeight(previousHeight);
  animateListShift(previousRects, { onlyMovedDown: true });
  task.addEventListener("animationend", () => task.classList.remove("is-new"), { once: true });

  if (wasScrollable) {
    requestAnimationFrame(() => taskList.scrollTo({ top: taskList.scrollHeight, behavior: "smooth" }));
  }

  newTaskInput.value = "";
  taskAddCard.classList.add("is-open");
  addTaskToggle.setAttribute("aria-expanded", "true");
  requestAnimationFrame(() => newTaskInput.focus());
}

function createTaskElement(title, done = false) {
  const task = document.createElement("div");
  task.className = `task-item flex flex-col rounded-lg p-standard${done ? " is-done" : ""}`;
  task.innerHTML = `
    <div class="task-head flex items-center justify-between">
      <div class="flex items-center gap-standard">
        <button aria-label="Complete task" class="complete-toggle ${done ? "is-checked text-primary" : "text-outline hover:text-primary transition-colors"} flex items-center justify-center" type="button">
          <span class="complete-icon material-symbols-outlined" style="font-variation-settings: 'FILL' ${done ? 1 : 0};">${done ? "check_circle" : "circle"}</span>
        </button>
        <span class="task-title font-task-text text-task-text text-on-surface"></span>
      </div>
      <div class="flex items-center gap-2">
        <div class="done-actions flex gap-1">
          <button aria-label="Edit task" class="edit-task rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[18px]">edit</span></button>
          <button aria-label="Delete task" class="delete-task rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[18px]">delete</span></button>
        </div>
        <button aria-expanded="true" aria-label="Collapse subtasks" class="collapse-toggle text-outline hover:text-on-surface p-1 items-center justify-center" type="button"><span class="material-symbols-outlined text-[20px]">expand_more</span></button>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="subtask-panel"><div class="subtask-inner"></div></div>
  `;
  task.querySelector(".task-title").textContent = title;
  return task;
}

function createSubtaskElement(title, done = false) {
  const row = document.createElement("div");
  row.className = "subtask-row flex items-center gap-standard";
  row.innerHTML = `
    <button aria-label="Complete subtask" class="complete-toggle ${done ? "is-checked text-primary" : "text-outline hover:text-primary transition-colors"} flex items-center justify-center" type="button">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' ${done ? 1 : 0};">${done ? "check_circle" : "circle"}</span>
    </button>
    <span class="subtask-title font-task-subtext text-task-subtext ${done ? "text-outline line-through" : "text-on-surface"}"></span>
    <div class="subtask-actions flex gap-1">
      <button aria-label="Edit subtask" class="edit-task edit-subtask rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[16px]">edit</span></button>
      <button aria-label="Delete subtask" class="delete-task delete-subtask rounded-md flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[16px]">delete</span></button>
    </div>
  `;
  row.querySelector(".subtask-title").textContent = title;
  return row;
}

function removeTask(task, startOffset = 0) {
  if (!task || task.classList.contains("add-task-card")) return;

  const previousRects = snapshotMovables();
  const previousHeight = snapshotWidgetHeight();
  let removed = false;
  const finish = () => {
    if (removed) return;
    removed = true;
    task.remove();
    animateListShift(previousRects);
    animateWidgetHeightAfterListShift(previousHeight);
  };

  task.style.transform = `translateX(${startOffset}px)`;
  task.classList.add("is-removing");
  const animation = task.animate(
    [
      { opacity: 1, transform: `translate3d(${startOffset}px, 0, 0) scale(1)` },
      { opacity: 0, transform: "translate3d(52px, 0, 0) scale(.96)" }
    ],
    { duration: 220, easing: "cubic-bezier(.4, 0, .2, 1)", fill: "forwards" }
  );
  animation.finished.then(finish, finish);
  window.setTimeout(finish, 280);
}

function removeSubtask(row, startOffset = 0) {
  if (!row) return;

  const task = row.closest(".task-item");
  const previousRects = snapshotMovables();
  const previousHeight = snapshotWidgetHeight();
  let removed = false;
  const finish = () => {
    if (removed) return;
    removed = true;
    row.remove();
    normalizeTaskSubtasks(task);
    animateListShift(previousRects);
    animateWidgetHeightAfterListShift(previousHeight);
  };

  row.style.transform = `translateX(${startOffset}px)`;
  row.classList.add("is-removing");
  const animation = row.animate(
    [
      { opacity: 1, transform: `translate3d(${startOffset}px, 0, 0) scale(1)` },
      { opacity: 0, transform: "translate3d(42px, 0, 0) scale(.96)" }
    ],
    { duration: 190, easing: "cubic-bezier(.4, 0, .2, 1)", fill: "forwards" }
  );
  animation.finished.then(finish, finish);
  window.setTimeout(finish, 250);
}

function handleSwipeRelease(event) {
  if (!swipeState || swipeState.pointerId !== event.pointerId || dragState) return false;

  const { element, startX, startY, active } = swipeState;
  const deltaX = event.clientX - startX;
  const deltaY = event.clientY - startY;
  const shouldAct = active && Math.abs(deltaX) >= SWIPE_ACTION_DISTANCE && Math.abs(deltaX) > Math.abs(deltaY) * 1.25;
  const releaseOffset = getSwipePreviewOffset(deltaX);

  resetSwipe(event, shouldAct && deltaX > 0);

  if (!shouldAct) return false;

  event.preventDefault();
  suppressNextClick = true;

  if (deltaX < 0) startEdit(element);
  else if (element.classList.contains("subtask-row")) removeSubtask(element, releaseOffset);
  else removeTask(element, releaseOffset);

  return true;
}

function resetSwipe(event, keepTransform = false) {
  if (!swipeState) return;
  const { element, pointerId } = swipeState;
  element.classList.remove("is-swipe-preview");
  if (!keepTransform) element.style.transform = "";
  swipeState = null;
  clearPendingDrag(false);
  if (event && taskList.hasPointerCapture(pointerId)) taskList.releasePointerCapture(pointerId);
}

function getSwipePreviewOffset(deltaX) {
  return Math.max(-52, Math.min(52, deltaX * .38));
}

function startEdit(item) {
  if (!item || item.classList.contains("is-editing")) return;

  const label = item.classList.contains("subtask-row")
    ? item.querySelector(".subtask-title")
    : item.querySelector(":scope > .task-head .task-title");

  if (!label) return;

  const previousText = label.textContent.trim();
  const shell = document.createElement("span");
  shell.className = "edit-name-shell flex flex-1 items-center gap-2 px-2 py-0 bg-white/[0.02] rounded-lg border border-white/[0.04] focus-within:bg-white/[0.05] focus-within:border-white/10";

  const input = document.createElement("input");
  input.className = item.classList.contains("subtask-row")
    ? "edit-name-input bg-transparent border-none w-full font-task-subtext text-task-subtext text-on-surface focus:ring-0 p-0 caret-primary"
    : "edit-name-input bg-transparent border-none w-full font-task-text text-task-text text-on-surface focus:ring-0 p-0 caret-primary";
  input.type = "text";
  input.value = previousText;
  input.setAttribute("aria-label", item.classList.contains("subtask-row") ? "Edit subtask name" : "Edit task name");

  shell.appendChild(input);
  const previousHeight = snapshotWidgetHeight();
  item.classList.add("is-editing");
  label.replaceWith(shell);
  animateWidgetHeight(previousHeight);
  input.focus();
  input.select();

  const finish = (save) => {
    const previousHeight = snapshotWidgetHeight();
    const next = save ? input.value.trim() : previousText;
    label.textContent = next || previousText;
    shell.replaceWith(label);
    item.classList.remove("is-editing");
    animateWidgetHeight(previousHeight);
  };

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.isComposing) {
      event.preventDefault();
      finish(true);
    }
    if (event.key === "Escape") {
      event.preventDefault();
      finish(false);
    }
  });
  input.addEventListener("blur", () => finish(true), { once: true });
}

function isInteractiveTarget(target) {
  return Boolean(target.closest("button, input, form, a"));
}

function clearPendingDrag(releasePointer = true) {
  if (!pendingDrag) return;
  const pointerId = pendingDrag.pointerId;
  window.clearTimeout(pendingDrag.timer);
  pendingDrag = null;
  document.body.classList.remove("is-dragging-task");
  if (releasePointer && taskList.hasPointerCapture(pointerId)) taskList.releasePointerCapture(pointerId);
}

function startDrag() {
  if (!pendingDrag) return;

  swipeState = null;
  const { type, element, pointerId, currentX, currentY, sourceTask } = pendingDrag;
  document.body.classList.add("is-dragging-task");
  window.getSelection()?.removeAllRanges();

  const rect = element.getBoundingClientRect();
  const scrollX = window.scrollX || window.pageXOffset;
  const scrollY = window.scrollY || window.pageYOffset;

  const placeholder = document.createElement("div");
  placeholder.className = type === "task" ? "drop-main-placeholder" : "drop-subtask-placeholder";
  placeholder.style.height = `${rect.height}px`;

  if (type === "task") taskList.insertBefore(placeholder, element);
  else element.parentElement.insertBefore(placeholder, element);

  const previousMargin = element.style.margin;
  const previousDisplay = element.style.display;
  const previousVisibility = element.style.visibility;
  const ghost = element.cloneNode(true);
  ghost.removeAttribute("id");
  ghost.classList.add("drag-ghost", "is-dragging");
  Object.assign(ghost.style, {
    position: "absolute",
    left: "0",
    top: "0",
    width: `${rect.width}px`,
    margin: "0",
    transform: `translate3d(${rect.left + scrollX}px, ${rect.top + scrollY}px, 0)`
  });

  element.classList.add("is-dragging");
  element.style.display = "none";
  element.style.visibility = "hidden";
  document.body.appendChild(ghost);

  dragState = {
    type,
    element,
    ghost,
    sourceTask,
    placeholder,
    pointerId,
    offsetX: currentX - rect.left,
    offsetY: currentY - rect.top,
    dragWidth: rect.width,
    dragHeight: rect.height,
    originalMargin: previousMargin,
    originalDisplay: previousDisplay,
    originalVisibility: previousVisibility,
    mode: type === "task" ? "main" : "subtask"
  };

  pendingDrag = null;
  moveDraggedItem(currentX, currentY);
}

function moveDraggedItem(clientX, clientY) {
  const { element, ghost, offsetX, offsetY } = dragState;
  const scrollX = window.scrollX || window.pageXOffset;
  const scrollY = window.scrollY || window.pageYOffset;

  ghost.style.transform = `translate3d(${clientX + scrollX - offsetX}px, ${clientY + scrollY - offsetY}px, 0)`;

  const previousRects = snapshotMovables();
  const previousHeight = snapshotWidgetHeight();
  clearDropTargets();

  const targetTask = getTaskUnderPointer(clientX, clientY);
  const canBecomeSubtask = dragState.type === "subtask" || !element.classList.contains("has-subtasks");

  if (canBecomeSubtask && targetTask && targetTask !== element && targetTask !== dragState.sourceTask) {
    placeSubtaskPlaceholder(targetTask, clientY);
  } else if (dragState.type === "subtask" && targetTask === dragState.sourceTask) {
    placeSubtaskPlaceholder(targetTask, clientY);
  } else {
    placeMainPlaceholder(clientY);
  }

  animateWidgetHeight(previousHeight);
  animateListShift(previousRects);
}

function getTaskUnderPointer(clientX, clientY) {
  const element = document.elementFromPoint(clientX, clientY);
  return element?.closest(".task-item:not(.is-dragging):not(.add-task-card)");
}

function placeMainPlaceholder(clientY) {
  dragState.mode = "main";
  dragState.targetTask = null;
  dragState.placeholder.className = "drop-main-placeholder";
  dragState.placeholder.style.height = dragState.type === "task" ? `${dragState.dragHeight}px` : "48px";

  const afterElement = getMainAfterElement(clientY);
  if (afterElement) taskList.insertBefore(dragState.placeholder, afterElement);
  else taskList.insertBefore(dragState.placeholder, taskAddCard);
}

function placeSubtaskPlaceholder(targetTask, clientY) {
  dragState.mode = "subtask";
  dragState.targetTask = targetTask;
  previewSubtaskChrome(targetTask);
  targetTask.classList.add("is-subtask-target");

  const inner = targetTask.querySelector(".subtask-inner");
  dragState.placeholder.className = "drop-subtask-placeholder";
  dragState.placeholder.style.height = "32px";

  const afterRow = getSubtaskAfterElement(inner, clientY);
  if (afterRow) inner.insertBefore(dragState.placeholder, afterRow);
  else inner.appendChild(dragState.placeholder);
}

function getMainAfterElement(clientY) {
  return getTaskItems()
    .filter((item) => !item.classList.contains("is-dragging") && item !== dragState.sourceTask)
    .reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = clientY - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset, element: child };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
}

function getSubtaskAfterElement(inner, clientY) {
  return Array.from(inner.querySelectorAll(".subtask-row:not(.is-dragging)"))
    .reduce((closest, row) => {
      const box = row.getBoundingClientRect();
      const offset = clientY - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) return { offset, element: row };
      return closest;
    }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
}

function finishDrag(event) {
  if (pendingDrag && pendingDrag.pointerId === event.pointerId) clearPendingDrag();
  if (!dragState || dragState.pointerId !== event.pointerId) return;

  const previousRects = snapshotMovables();
  const previousHeight = snapshotWidgetHeight();
  const { type, element, placeholder, sourceTask, mode, targetTask, originalMargin, originalDisplay, originalVisibility } = dragState;

  if (mode === "subtask") {
    ensureSubtaskChrome(targetTask);

    if (type === "task") {
      const row = createSubtaskElement(getTaskTitle(element), isTaskDone(element));
      placeholder.replaceWith(row);
      element.remove();
    } else {
      resetDraggedElement(element, originalMargin, originalDisplay, originalVisibility);
      placeholder.replaceWith(element);
    }

    if (sourceTask && sourceTask !== targetTask) normalizeTaskSubtasks(sourceTask);
    normalizeTaskSubtasks(targetTask);
  } else {
    if (type === "subtask") {
      const task = createTaskElement(getSubtaskTitle(element), isSubtaskDone(element));
      placeholder.replaceWith(task);
      element.remove();
      normalizeTaskSubtasks(sourceTask);
      task.classList.add("is-drop-settling");
      task.addEventListener("animationend", () => task.classList.remove("is-drop-settling"), { once: true });
    } else {
      resetDraggedElement(element, originalMargin, originalDisplay, originalVisibility);
      placeholder.replaceWith(element);
      element.classList.add("is-drop-settling");
      element.addEventListener("animationend", () => element.classList.remove("is-drop-settling"), { once: true });
    }
  }

  dragState.ghost.remove();
  clearDropTargets();
  animateWidgetHeight(previousHeight);
  animateListShift(previousRects);
  dragState = null;
  document.body.classList.remove("is-dragging-task");
  suppressNextClick = true;

  if (taskList.hasPointerCapture(event.pointerId)) taskList.releasePointerCapture(event.pointerId);
}

function resetDraggedElement(element, originalMargin, originalDisplay, originalVisibility) {
  element.classList.remove("is-dragging");
  element.style.position = "";
  element.style.left = "";
  element.style.top = "";
  element.style.width = "";
  element.style.margin = originalMargin || "";
  element.style.display = originalDisplay || "";
  element.style.visibility = originalVisibility || "";
  element.style.transform = "";
}

function clearDropTargets() {
  taskList.querySelectorAll(".is-subtask-target").forEach((task) => {
    task.classList.remove("is-subtask-target");
    if (!getSubtaskRows(task).length) {
      task.classList.remove("has-subtasks", "is-growing", "is-collapsed");
      task.querySelector(".progress-fill").style.width = "0%";
    }
  });
}

function previewSubtaskChrome(task) {
  if (task.classList.contains("has-subtasks")) return;
  task.classList.add("has-subtasks", "is-growing");
  task.classList.remove("is-collapsed");
  task.querySelector(".collapse-toggle")?.setAttribute("aria-expanded", "true");
}

function ensureSubtaskChrome(task) {
  if (task.classList.contains("has-subtasks")) return;
  task.classList.add("has-subtasks", "is-growing");
  task.classList.remove("is-collapsed");
  task.querySelector(".collapse-toggle")?.setAttribute("aria-expanded", "true");
  task.addEventListener("animationend", () => task.classList.remove("is-growing"), { once: true });
}

function normalizeTaskSubtasks(task) {
  if (!task) return;

  const rows = getSubtaskRows(task);
  task.classList.toggle("has-subtasks", rows.length > 0);

  if (!rows.length) {
    task.classList.remove("is-collapsed");
    task.querySelector(".progress-fill").style.width = "0%";
    return;
  }

  updateTaskFromSubtasks(task);
}

function getTaskTitle(task) {
  return task.querySelector(".task-title")?.textContent.trim() || "Untitled task";
}

function getSubtaskTitle(row) {
  return row.querySelector(".subtask-title")?.textContent.trim() || "Untitled subtask";
}

function isTaskDone(task) {
  return task.classList.contains("is-done");
}

function isSubtaskDone(row) {
  return row.querySelector(".complete-toggle")?.classList.contains("is-checked") || false;
}

function setCompleteButton(button, checked) {
  const icon = button.querySelector(".material-symbols-outlined");
  button.classList.toggle("is-checked", checked);
  button.classList.toggle("text-primary", checked);
  button.classList.toggle("text-outline", !checked);
  icon.textContent = checked ? "check_circle" : "circle";
  icon.style.fontVariationSettings = `'FILL' ${checked ? 1 : 0}`;
}

function setSubtaskComplete(button, checked) {
  setCompleteButton(button, checked);
  const label = button.closest(".subtask-row")?.querySelector(".subtask-title");
  if (!label) return;
  label.classList.toggle("line-through", checked);
  label.classList.toggle("text-outline", checked);
  label.classList.toggle("text-on-surface", !checked);
}

function setTaskDone(task, done) {
  const previousHeight = snapshotWidgetHeight();
  const mainButton = task.querySelector(":scope > .task-head .complete-toggle");
  if (mainButton) setCompleteButton(mainButton, done);

  task.classList.toggle("is-done", done);
  task.classList.remove("is-completing");
  void task.offsetWidth;
  task.classList.add("is-completing");
  animateWidgetHeight(previousHeight);
}

function updateTaskFromSubtasks(task, options = {}) {
  const rows = getSubtaskRows(task);
  if (!rows.length) return;

  const completed = rows.filter((row) => isSubtaskDone(row)).length;
  const progressFill = task.querySelector(".progress-fill");

  if (progressFill) progressFill.style.width = `${Math.round((completed / rows.length) * 100)}%`;
  if (!options.skipDone) setTaskDone(task, completed === rows.length);
}

getTaskItems().forEach(normalizeTaskSubtasks);
initializeWidgetHeight();
window.addEventListener("load", settleWidgetHeight);
window.addEventListener("resize", settleWidgetHeight);
if (document.fonts?.ready) {
  document.fonts.ready.then(() => {
    applyWidgetHeight();
    enableWidgetHeightTransitions();
  });
} else {
  requestAnimationFrame(enableWidgetHeightTransitions);
}
</script>
</body>
</html>
